name: kubernetes-e2e

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: stateproof-e2e
          wait: 120s
      - run: kubectl cluster-info
      - run: go build -o stateproof .
      - run: go test -tags=e2e -p 1 ./e2e -v
      - if: failure()
        run: |
          kubectl get deployments,replicasets,pods -A -o yaml
          kubectl get events -A --sort-by=.lastTimestamp
